<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Dola Scene Saver</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a;background:#f1f5f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:14px 14px 100px}.top{position:sticky;top:0;z-index:4;padding:12px 0;background:rgba(241,245,249,.92);backdrop-filter:blur(15px)}h1{font-size:24px;margin:0}.muted{color:#64748b;font-size:13px}.card{background:#fff;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 2px 14px rgba(15,23,42,.06)}label{font-size:13px;font-weight:700;display:block;margin:12px 0 6px}input,textarea,select,button{font:inherit;width:100%}input,textarea,select{border:1px solid #cbd5e1;border-radius:14px;padding:12px;background:#fff}textarea{min-height:100px;resize:vertical}button{border:0;border-radius:14px;padding:13px;font-weight:800;background:#0f172a;color:#fff;margin-top:10px}button.secondary{background:#e2e8f0;color:#0f172a}button.green{background:#059669}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.hidden{display:none}.status{display:inline-block;border-radius:999px;padding:5px 9px;background:#eef2ff;font-size:12px;font-weight:700}.ok{background:#dcfce7}.project{border:1px solid #e2e8f0;border-radius:16px;padding:12px;margin-top:9px}.project.active{border-color:#0f172a}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.thumb{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:14px;background:#e2e8f0}.sticky{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);backdrop-filter:blur(15px);border-top:1px solid #e2e8f0}.sticky>div{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.sticky button{margin:0}.code{white-space:pre-wrap;background:#f8fafc;border-radius:12px;padding:10px;font-size:12px;max-height:220px;overflow:auto}.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:11px;font-size:13px}.linkbox{word-break:break-all;font-size:12px;background:#f8fafc;padding:9px;border-radius:10px;margin-top:7px}.progress{height:8px;border-radius:99px;background:#e2e8f0;overflow:hidden;margin-top:10px}.progress div{height:100%;width:0;background:#0f172a}
</style>
</head>
<body><div class="wrap">
<div class="top"><h1>Dola Scene Saver</h1><div class="muted">Product → AI → Dola Scene 1/2 → รวมคลิป + TTS</div></div>
<div id="aiNotice" class="notice hidden">AI ยังไม่เปิดใช้งาน เพราะยังไม่ได้ตั้ง GEMINI_API_KEY แต่ส่วนสร้างโปรเจกต์ รับลิงก์ Dola และรวมคลิปยังใช้ได้</div>
<div id="shareBox" class="card hidden"><b>รับลิงก์จาก Dola</b><div id="shareText" class="linkbox"></div><label>โปรเจกต์</label><select id="shareProject"></select><label>ลิงก์นี้คือ</label><select id="shareScene"><option value="scene1">Scene 1</option><option value="scene2">Scene 2</option></select><button onclick="saveShared()">บันทึกเข้าโปรเจกต์</button></div>
<div class="card"><b>1. สร้างงาน</b><label>ชื่อสินค้า</label><input id="name" placeholder="ชื่อสินค้า"><label>รายละเอียดสินค้า</label><textarea id="detail" placeholder="วางรายละเอียดสินค้า"></textarea><label>รูปสินค้า</label><input id="image" type="file" accept="image/*"><img id="preview" class="thumb hidden"><button onclick="createProject()">สร้างโปรเจกต์ + วิเคราะห์ AI</button></div>
<div class="card"><div class="row"><b>โปรเจกต์</b><span id="count" class="status"></span></div><div id="projects"></div></div>
<div id="work" class="card hidden"><div class="row"><div><b id="workTitle"></b><div id="workDetail" class="muted"></div></div><span id="workStatus" class="status">พร้อม</span></div>
<label>Prompt Before</label><textarea id="beforePrompt"></textarea><label>Prompt After</label><textarea id="afterPrompt"></textarea>
<div class="grid"><button class="secondary" onclick="copy('beforePrompt')">คัดลอก Before</button><button class="secondary" onclick="copy('afterPrompt')">คัดลอก After</button></div>
<label>Prompt Scene 1</label><textarea id="scene1Prompt"></textarea><label>Prompt Scene 2</label><textarea id="scene2Prompt"></textarea>
<div class="grid"><button onclick="openDola(1)">เปิด Dola ซีน 1</button><button onclick="openDola(2)">เปิด Dola ซีน 2</button></div>
<label>Scene 1 URL</label><input id="scene1Url" onchange="saveField('scene1Url',this.value)" placeholder="ลิงก์ MP4 จาก Dola"><label>Scene 2 URL</label><input id="scene2Url" onchange="saveField('scene2Url',this.value)" placeholder="ลิงก์ MP4 จาก Dola">
<label>สคริปต์เสียง</label><textarea id="voiceScript"></textarea><div class="grid"><button class="secondary" onclick="saveField('voiceScript',document.getElementById('voiceScript').value)">บันทึก</button><button class="green" onclick="tts()">เจนเสียง TTS</button></div><audio id="audio" controls style="width:100%;margin-top:10px"></audio>
<button onclick="merge()">รวม Scene 1 + Scene 2 + เสียง</button><div class="progress"><div id="bar"></div></div><div id="msg" class="muted"></div><a id="download" class="hidden"><button class="green">ดาวน์โหลด Final MP4</button></a>
<details><summary>AI analysis / caption</summary><div id="analysis" class="code"></div></details></div>
</div><div class="sticky"><div><button class="secondary" onclick="resetForm()">+ งานใหม่</button><button onclick="render()">โปรเจกต์ทั้งหมด</button></div></div>
<script type="module">
const KEY='dola-scene-saver-v2';let list=JSON.parse(localStorage.getItem(KEY)||'[]'),activeId=localStorage.getItem('dola-active-v2')||'',imageData='';const $=x=>document.getElementById(x);const current=()=>list.find(x=>x.id===activeId);const save=()=>localStorage.setItem(KEY,JSON.stringify(list));
async function health(){try{const j=await(await fetch('/api/health')).json();if(!j.ai)$('aiNotice').classList.remove('hidden')}catch{}}
function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function note(t){$('msg').textContent=t}function stat(t){$('workStatus').textContent=t}
window.render=function(){list=JSON.parse(localStorage.getItem(KEY)||'[]');$('count').textContent=list.length+' งาน';$('projects').innerHTML=list.length?list.map(p=>'<div class="project '+(p.id===activeId?'active':'')+'"><div class="row"><div><b>'+esc(p.name)+'</b><div class="muted">'+new Date(p.createdAt).toLocaleString('th-TH')+'</div></div><span class="status '+(p.scene1Url&&p.scene2Url?'ok':'')+'">'+(p.scene1Url&&p.scene2Url?'ครบ 2 ซีน':'รอซีน')+'</span></div><button class="secondary" onclick="selectProject(\''+p.id+'\')">เปิด</button></div>').join(''):'<div class="muted">ยังไม่มีงาน</div>';refreshShare()}
window.selectProject=function(id){activeId=id;localStorage.setItem('dola-active-v2',id);const p=current();if(!p)return;$('work').classList.remove('hidden');$('workTitle').textContent=p.name;$('workDetail').textContent=p.detail||'';for(const k of ['beforePrompt','afterPrompt','scene1Prompt','scene2Prompt','scene1Url','scene2Url','voiceScript'])$(k).value=p[k]||'';$('analysis').textContent=[p.analysis,p.caption,p.hashtags].filter(Boolean).join('\n\n');if(p.audioUrl)$('audio').src=p.audioUrl;render();setTimeout(()=>$('work').scrollIntoView({behavior:'smooth'}),50)}
window.resetForm=function(){activeId='';$('name').value='';$('detail').value='';$('image').value='';$('preview').classList.add('hidden');$('work').classList.add('hidden');scrollTo({top:0,behavior:'smooth'})}
$('image').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;imageData=await shrink(f);$('preview').src=imageData;$('preview').classList.remove('hidden')});function dataURL(f){return new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)})}async function shrink(f){const src=await dataURL(f),im=new Image();await new Promise((r,j)=>{im.onload=r;im.onerror=j;im.src=src});const scale=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.8)}
window.createProject=async function(){const name=$('name').value.trim();if(!name)return alert('ใส่ชื่อสินค้าก่อน');const p={id:crypto.randomUUID(),name,detail:$('detail').value.trim(),image:imageData,createdAt:Date.now(),scene1Url:'',scene2Url:''};list.unshift(p);activeId=p.id;save();localStorage.setItem('dola-active-v2',p.id);selectProject(p.id);stat('AI กำลังวิเคราะห์');try{const r=await fetch('/api/analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:p.name,detail:p.detail,image:p.image})}),j=await r.json();if(!r.ok)throw new Error(j.error||'AI error');Object.assign(p,j);save();selectProject(p.id);stat('AI พร้อม')}catch(e){stat('บันทึกงานแล้ว');note(e.message)}}
window.saveField=function(k,v){const p=current();if(!p)return;p[k]=v;save();render()};window.copy=async id=>{await navigator.clipboard.writeText($(id).value);note('คัดลอกแล้ว')};window.openDola=async n=>{const id=n===1?'scene1Prompt':'scene2Prompt';await navigator.clipboard.writeText($(id).value);window.open('https://www.dola.com/chat/','_blank')}
function refreshShare(){$('shareProject').innerHTML=list.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')}const q=new URLSearchParams(location.search),shared=q.get('share')||q.get('url');if(shared){$('shareBox').classList.remove('hidden');$('shareText').textContent=shared;setTimeout(refreshShare,0)}window.saveShared=function(){const p=list.find(x=>x.id===$('shareProject').value);if(!p)return alert('ไม่พบโปรเจกต์');p[$('shareScene').value+'Url']=shared;save();history.replaceState({},'',location.pathname);$('shareBox').classList.add('hidden');selectProject(p.id);note('บันทึกลิงก์แล้ว')}
function wavUrl(mime,b64){const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(!(mime||'').toLowerCase().includes('l16'))return 'data:'+(mime||'audio/mpeg')+';base64,'+b64;const out=new Uint8Array(44+bin.length),v=new DataView(out.buffer),w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));w(0,'RIFF');v.setUint32(4,36+bin.length,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,24000,true);v.setUint32(28,48000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,bin.length,true);out.set(bin,44);return URL.createObjectURL(new Blob([out],{type:'audio/wav'}))}
window.tts=async function(){const p=current();if(!p)return;p.voiceScript=$('voiceScript').value.trim();save();if(!p.voiceScript)return alert('ยังไม่มีสคริปต์');stat('กำลังเจนเสียง');try{const r=await fetch('/api/tts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:p.voiceScript})}),j=await r.json();if(!r.ok)throw new Error(j.error||'TTS error');p.audioUrl=wavUrl(j.mimeType,j.base64);$('audio').src=p.audioUrl;stat('เสียงพร้อม')}catch(e){stat('TTS ไม่พร้อม');note(e.message)}}
window.merge=async function(){const p=current();if(!p?.scene1Url||!p?.scene2Url)return alert('ต้องมีลิงก์ Scene 1 และ Scene 2 ก่อน');note('กำลังเตรียมตัวรวมวิดีโอ');$('bar').style.width='8%';try{const [{FFmpeg},{toBlobURL}]=await Promise.all([import('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js'),import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js')]),ff=new FFmpeg();ff.on('progress',e=>$('bar').style.width=Math.max(10,Math.round(e.progress*100))+'%');const base='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm';await ff.load({coreURL:await toBlobURL(base+'/ffmpeg-core.js','text/javascript'),wasmURL:await toBlobURL(base+'/ffmpeg-core.wasm','application/wasm')});const load=async u=>new Uint8Array(await(await fetch('/api/proxy?url='+encodeURIComponent(u))).arrayBuffer());await ff.writeFile('a.mp4',await load(p.scene1Url));await ff.writeFile('b.mp4',await load(p.scene2Url));await ff.writeFile('list.txt',new TextEncoder().encode("file 'a.mp4'\nfile 'b.mp4'\n"));await ff.exec(['-f','concat','-safe','0','-i','list.txt','-c','copy','joined.mp4']);let file='joined.mp4';if(p.audioUrl){await ff.writeFile('voice.wav',new Uint8Array(await(await fetch(p.audioUrl)).arrayBuffer()));await ff.exec(['-i','joined.mp4','-i','voice.wav','-map','0:v:0','-map','1:a:0','-c:v','copy','-c:a','aac','-shortest','final.mp4']);file='final.mp4'}const data=await ff.readFile(file),url=URL.createObjectURL(new Blob([data.buffer],{type:'video/mp4'}));$('download').href=url;$('download').download=p.name+'-final.mp4';$('download').classList.remove('hidden');$('bar').style.width='100%';note('รวมคลิปเสร็จแล้ว')}catch(e){note('รวมคลิปไม่สำเร็จ: '+e.message)}}
health();render();if(activeId)selectProject(activeId);
</script></body></html>
