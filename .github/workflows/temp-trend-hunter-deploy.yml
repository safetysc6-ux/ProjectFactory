name: temp-trend-hunter-deploy
on:
  push:
    branches: [sync/affiliate-d1]
    paths: ['.github/workflows/temp-trend-hunter-deploy.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ensure D1 exists
        run: |
          npx --yes wrangler@latest d1 list --json > /tmp/d1.json
          if ! node -e "const a=require('/tmp/d1.json');process.exit(a.some(x=>x.name==='shopee-trend-hunter-db')?0:1)"; then
            npx --yes wrangler@latest d1 create shopee-trend-hunter-db
            npx --yes wrangler@latest d1 list --json > /tmp/d1.json
          fi
          node -e "const a=require('/tmp/d1.json');const x=a.find(x=>x.name==='shopee-trend-hunter-db');if(!x)process.exit(1);require('fs').appendFileSync(process.env.GITHUB_ENV,'D1_ID='+x.uuid+'\n')"
      - uses: actions/checkout@v4
        with:
          repository: safetysc6-ux/shopee-ai-dashboard
          ref: feat/trend-hunter-v1
          token: ${{ secrets.PROJECTFACTORY_GITHUB_TOKEN || github.token }}
          path: target
      - name: Configure D1
        working-directory: target
        run: sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$D1_ID/" wrangler.toml
      - name: Install
        working-directory: target
        run: npm install
      - name: Apply schema
        working-directory: target
        run: npx wrangler d1 execute shopee-trend-hunter-db --file=schema.sql --remote
      - name: Deploy Worker
        working-directory: target
        run: npm run deploy
      - name: Verify API
        run: |
          for i in 1 2 3 4 5; do
            sleep 4
            if curl --fail --silent --show-error https://shopee-trend-hunter.safetysc6.workers.dev/api/trends; then exit 0; fi
          done
          exit 1
      - name: Save D1 id to branch
        if: always()
        working-directory: target
        run: |
          git config user.name projectfactory-bot
          git config user.email actions@github.com
          git add wrangler.toml
          git diff --cached --quiet || git commit -m 'chore: bind Trend Hunter D1'
          git push origin HEAD:feat/trend-hunter-v1
