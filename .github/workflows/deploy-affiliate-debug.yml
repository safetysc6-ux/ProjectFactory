name: deploy-affiliate-debug

on:
  push:
    branches:
      - sync/affiliate-d1
    paths:
      - .github/workflows/deploy-affiliate-debug.yml
      - .sync/deploy-affiliate-debug-trigger.txt

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: safetysc6-ux/affiliate-test-v2
          ref: main
          token: ${{ secrets.PROJECTFACTORY_GITHUB_TOKEN }}
          path: target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        working-directory: target
        run: npm install
      - name: Deploy
        working-directory: target
        run: npm run deploy
      - name: Verify and sync
        run: |
          sleep 5
          echo '--- DEBUG ---'
          curl --fail --silent --show-error 'https://affiliate-test-v2-cf.safetysc6.workers.dev/api/sync-debug'
          echo
          echo '--- SYNC ---'
          curl --fail --silent --show-error -X POST 'https://affiliate-test-v2-cf.safetysc6.workers.dev/api/sync-sheet'
          echo
          echo '--- REPORTS ---'
          curl --fail --silent --show-error 'https://affiliate-test-v2-cf.safetysc6.workers.dev/api/reports' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s); console.log(JSON.stringify({source:j.source,last_synced_at:j.last_synced_at,days:j.daily?.length,latest:j.daily?.at(-1)},null,2))})"
