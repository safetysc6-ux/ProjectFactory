name: deploy-affiliate-debug

on:
  push:
    branches:
      - sync/affiliate-d1
    paths:
      - .github/workflows/deploy-affiliate-debug.yml
      - .sync/deploy-affiliate-debug-trigger.txt

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: safetysc6-ux/affiliate-test-v2
          ref: main
          token: ${{ secrets.PROJECTFACTORY_GITHUB_TOKEN }}
          path: target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        working-directory: target
        run: npm install
      - name: Deploy
        working-directory: target
        run: npm run deploy
      - name: Verify debug endpoint
        run: |
          sleep 5
          curl --fail --silent --show-error 'https://affiliate-test-v2-cf.safetysc6.workers.dev/api/sync-debug'
