name: deploy-mirror-sync

on:
  push:
    branches: [sync/affiliate-d1]
    paths:
      - '.github/workflows/deploy-mirror-sync.yml'

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify deployed sync mode
        run: |
          curl --fail --silent --show-error https://affiliate-test-v2-cf.safetysc6.workers.dev/api/sync-sheet
      - name: Sync Sheet to D1 again
        run: |
          curl --fail --silent --show-error -X POST https://affiliate-test-v2-cf.safetysc6.workers.dev/api/sync-sheet
      - name: Remove stale Sep 5 row directly once
        run: |
          npx --yes wrangler@latest d1 execute affiliate-dashboard-db --remote --command "DELETE FROM daily_report WHERE date='2026-09-05';"
      - name: Verify stale row is gone
        run: |
          OUT=$(npx --yes wrangler@latest d1 execute affiliate-dashboard-db --remote --command "SELECT COUNT(*) AS cnt FROM daily_report WHERE date='2026-09-05';" --json)
          echo "$OUT"
          node -e 'const x=JSON.parse(process.env.OUT); const rows=x?.[0]?.results||[]; if(Number(rows?.[0]?.cnt)!==0) process.exit(1);' 
        env:
          OUT: ${{ steps.none.outputs.out }}
