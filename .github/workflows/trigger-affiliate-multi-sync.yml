name: Trigger Affiliate Multi Account Sync

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/trigger-affiliate-multi-sync.yml"

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Sync daily reports
        run: |
          curl --fail --silent --show-error -X POST 'https://affiliate-test-v2-cf.safetysc6.workers.dev/api/sync-sheet' -o /tmp/daily-sync.json
          cat /tmp/daily-sync.json
          node -e "const x=require('/tmp/daily-sync.json'); if(!x.ok) process.exit(1); console.log('daily rows='+x.updated)"

      - name: Sync SubID reports
        run: |
          curl --fail --silent --show-error -X POST 'https://affiliate-test-v2-cf.safetysc6.workers.dev/api/sync-subids' -o /tmp/subid-sync.json
          cat /tmp/subid-sync.json
          node -e "const x=require('/tmp/subid-sync.json'); if(!x.ok) process.exit(1); console.log('subid rows='+x.updated)"

      - name: Verify all accounts
        run: |
          for account in all account_1 account_2; do
            curl --fail --silent --show-error "https://affiliate-test-v2-cf.safetysc6.workers.dev/api/reports?preset=all&account=${account}" -o "/tmp/${account}.json"
            node -e "const x=require('/tmp/${account}.json'); if(x.status!=='success'||x.source!=='cloudflare_d1'||!Array.isArray(x.daily)||!x.daily.length) process.exit(1); console.log('${account}: days='+x.daily.length+' last_sync='+x.last_synced_at)"
          done

      - name: Verify SubID API
        run: |
          for account in all account_1 account_2; do
            curl --fail --silent --show-error "https://affiliate-test-v2-cf.safetysc6.workers.dev/api/subids?account=${account}" -o "/tmp/subid-${account}.json"
            node -e "const x=require('/tmp/subid-${account}.json'); if(x.status!=='success') process.exit(1); console.log('${account}: subids='+x.items.length+' date='+x.date)"
          done
