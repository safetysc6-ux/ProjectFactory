name: cloudflare-check

on:
  workflow_dispatch:
  push:
    branches:
      - feat/token-efficient-compact-mode
    paths:
      - .github/workflows/cloudflare-check.yml

jobs:
  verify-cloudflare:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
      - name: Verify Cloudflare authentication
        run: npx --yes wrangler@latest whoami
      - name: Verify D1 access
        run: npx --yes wrangler@latest d1 list
      - name: Verify R2 access
        run: npx --yes wrangler@latest r2 bucket list
