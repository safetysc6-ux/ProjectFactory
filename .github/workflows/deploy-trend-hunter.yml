name: Deploy Trend Hunter
on:
  push:
    branches:
      - deploy/trend-hunter
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Trend Hunter
        uses: actions/checkout@v4
        with:
          repository: safetysc6-ux/shopee-ai-dashboard
          ref: main
          token: ${{ secrets.PROJECTFACTORY_GITHUB_TOKEN || github.token }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install
      - name: Migrate D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run d1:migrate
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
