name: smoke-private-deploy

on:
  push:
    branches:
      - test/cloudflare-smoke-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: safetysc6-ux/affiliate-test-v2
          ref: cloudflare-smoke
          token: ${{ secrets.PROJECTFACTORY_GITHUB_TOKEN }}
          path: target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        working-directory: target/cf-smoke
        run: npm install
      - name: Deploy
        working-directory: target/cf-smoke
        run: npx wrangler deploy
