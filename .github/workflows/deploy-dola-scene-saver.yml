name: deploy-dola-scene-saver

on:
  push:
    branches: [main]
    paths:
      - 'apps/dola-scene-saver/**'
      - '.github/workflows/deploy-dola-scene-saver.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dola-scene-saver
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Validate Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
      - name: Sync Gemini secret when available
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          else
            echo 'GEMINI_API_KEY is not configured; deploying UI with AI endpoints disabled.'
          fi
      - name: Deploy Worker
        run: npm run deploy
      - name: Health check
        run: |
          sleep 5
          curl --fail --silent --show-error https://dola-scene-saver.safetysc6.workers.dev/api/health
