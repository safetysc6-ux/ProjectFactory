name: deploy-affiliate-daily-fix

on:
  push:
    branches:
      - sync/affiliate-d1

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: safetysc6-ux/affiliate-test-v2
          ref: fix/daily-use-d1
          token: ${{ secrets.PROJECTFACTORY_GITHUB_TOKEN }}
          path: target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        working-directory: target
        run: npm install
      - name: Deploy
        working-directory: target
        run: npm run deploy
      - name: Verify daily page and D1 API
        run: |
          sleep 5
          curl --fail --silent --show-error 'https://affiliate-test-v2-cf.safetysc6.workers.dev/daily' >/dev/null
          curl --fail --silent --show-error 'https://affiliate-test-v2-cf.safetysc6.workers.dev/api/reports' >/tmp/reports.json
          node -e "const x=require('/tmp/reports.json'); const d=x.daily.find(r=>r.date==='2026-08-01'); if(x.source!=='cloudflare_d1'||!d||d.clicks!==317) process.exit(1); console.log('PASS source='+x.source+' Aug01='+d.clicks)"
