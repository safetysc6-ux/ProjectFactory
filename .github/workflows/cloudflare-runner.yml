name: cloudflare-runner

on:
  workflow_dispatch:
    inputs:
      action:
        description: Cloudflare action
        required: true
        type: choice
        options:
          - verify
          - inventory
          - d1_create
          - r2_create
      resource_name:
        description: Resource name for create actions
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Verify
        if: ${{ inputs.action == 'verify' }}
        run: |
          npx --yes wrangler@latest whoami
          npx --yes wrangler@latest d1 list
          npx --yes wrangler@latest r2 bucket list

      - name: Inventory
        if: ${{ inputs.action == 'inventory' }}
        run: |
          echo '--- D1 ---'
          npx --yes wrangler@latest d1 list
          echo '--- R2 ---'
          npx --yes wrangler@latest r2 bucket list

      - name: Create D1
        if: ${{ inputs.action == 'd1_create' }}
        run: |
          test -n "${{ inputs.resource_name }}" || (echo "resource_name is required" && exit 1)
          npx --yes wrangler@latest d1 create "${{ inputs.resource_name }}"

      - name: Create R2 bucket
        if: ${{ inputs.action == 'r2_create' }}
        run: |
          test -n "${{ inputs.resource_name }}" || (echo "resource_name is required" && exit 1)
          npx --yes wrangler@latest r2 bucket create "${{ inputs.resource_name }}"
