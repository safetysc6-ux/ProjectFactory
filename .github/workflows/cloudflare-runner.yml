name: cloudflare-runner

on:
  workflow_dispatch:
    inputs:
      action:
        description: Cloudflare action
        required: true
        type: choice
        options:
          - verify
          - inventory
          - d1_create
          - r2_create
          - d1_migrate
          - deploy_repo
      resource_name:
        description: D1/R2 resource name
        required: false
        type: string
      source_repo:
        description: owner/repo for repo-based actions
        required: false
        type: string
      source_ref:
        description: branch or ref
        required: false
        default: main
        type: string
      working_directory:
        description: directory containing package.json and wrangler config
        required: false
        default: .
        type: string
      health_url:
        description: optional URL to verify after deploy
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Verify
        if: ${{ inputs.action == 'verify' }}
        run: |
          npx --yes wrangler@latest whoami
          npx --yes wrangler@latest d1 list
          npx --yes wrangler@latest r2 bucket list

      - name: Inventory
        if: ${{ inputs.action == 'inventory' }}
        run: |
          echo '--- D1 ---'
          npx --yes wrangler@latest d1 list
          echo '--- R2 ---'
          npx --yes wrangler@latest r2 bucket list

      - name: Create D1
        if: ${{ inputs.action == 'd1_create' }}
        run: |
          test -n "${{ inputs.resource_name }}" || (echo "resource_name is required" && exit 1)
          npx --yes wrangler@latest d1 list | grep -q "${{ inputs.resource_name }}" || npx --yes wrangler@latest d1 create "${{ inputs.resource_name }}"

      - name: Create R2 bucket
        if: ${{ inputs.action == 'r2_create' }}
        run: |
          test -n "${{ inputs.resource_name }}" || (echo "resource_name is required" && exit 1)
          npx --yes wrangler@latest r2 bucket list | grep -q "${{ inputs.resource_name }}" || npx --yes wrangler@latest r2 bucket create "${{ inputs.resource_name }}"

      - name: Checkout target repo
        if: ${{ inputs.action == 'deploy_repo' || inputs.action == 'd1_migrate' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.PROJECTFACTORY_GITHUB_TOKEN || github.token }}
          path: target

      - name: Install target dependencies
        if: ${{ inputs.action == 'deploy_repo' || inputs.action == 'd1_migrate' }}
        working-directory: target/${{ inputs.working_directory }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Apply D1 migrations
        if: ${{ inputs.action == 'd1_migrate' }}
        working-directory: target/${{ inputs.working_directory }}
        run: |
          test -n "${{ inputs.resource_name }}" || (echo "resource_name is required" && exit 1)
          npx wrangler d1 migrations apply "${{ inputs.resource_name }}" --remote

      - name: Deploy target to Cloudflare
        if: ${{ inputs.action == 'deploy_repo' }}
        working-directory: target/${{ inputs.working_directory }}
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts&&p.scripts.deploy?0:1)"; then
            npm run deploy
          else
            npx wrangler deploy
          fi

      - name: Verify deployed endpoint
        if: ${{ inputs.action == 'deploy_repo' && inputs.health_url != '' }}
        run: |
          sleep 3
          curl --fail --silent --show-error "${{ inputs.health_url }}" >/dev/null
