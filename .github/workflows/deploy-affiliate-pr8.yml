name: Deploy Affiliate Main to Cloudflare

on:
  push:
    branches: [deploy/affiliate-pr8]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout affiliate main
        uses: actions/checkout@v4
        with:
          repository: safetysc6-ux/affiliate-test-v2
          ref: main
          token: ${{ secrets.PROJECTFACTORY_GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production
        run: |
          sleep 5
          curl -fsS --retry 3 --retry-delay 3 https://affiliate-test-v2-cf.safetysc6.workers.dev/api/sync-debug
