name: Deploy affiliate-test-v2 via ProjectFactory

# manual redeploy 2026-09-05 22:00 ICT
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-affiliate-test-v2.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Checkout affiliate-test-v2
        uses: actions/checkout@v4
        with:
          repository: safetysc6-ux/affiliate-test-v2
          ref: main
          token: ${{ secrets.PROJECTFACTORY_GITHUB_TOKEN || github.token }}
          path: target

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: target
        run: npm install

      - name: Apply D1 migrations
        working-directory: target
        run: |
          if [ -d migrations ]; then npx wrangler d1 migrations apply affiliate-dashboard-db --remote; fi

      - name: Deploy to Cloudflare
        working-directory: target
        run: npm run deploy

      - name: Verify endpoint
        run: |
          sleep 3
          curl --fail --silent --show-error https://affiliate-test-v2-cf.safetysc6.workers.dev >/dev/null
