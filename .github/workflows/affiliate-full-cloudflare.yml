name: affiliate-full-cloudflare

on:
  push:
    branches:
      - feat/framework-deploy-command

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: safetysc6-ux/affiliate-test-v2
          ref: cloudflare-full
          token: ${{ secrets.PROJECTFACTORY_GITHUB_TOKEN }}
          path: target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        working-directory: target
        run: npm install
      - name: Build and deploy full Next.js app
        working-directory: target
        run: npm run deploy
      - name: Verify homepage
        run: |
          sleep 5
          curl --fail --silent --show-error https://affiliate-test-v2-cf.safetysc6.workers.dev/ >/dev/null
      - name: Verify reports API
        run: |
          curl --fail --silent --show-error https://affiliate-test-v2-cf.safetysc6.workers.dev/api/reports >/tmp/reports.json
          node -e "const x=require('/tmp/reports.json'); if(x.status!=='success') process.exit(1)"
