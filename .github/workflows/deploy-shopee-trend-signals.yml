name: deploy-shopee-trend-signals
on:
  push:
    branches:
      - deploy/shopee-trend-signals
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || exit 1
          test -n "$CLOUDFLARE_ACCOUNT_ID" || exit 1
      - name: Checkout Trend Hunter
        uses: actions/checkout@v4
        with:
          repository: safetysc6-ux/shopee-ai-dashboard
          ref: main
          token: ${{ secrets.PROJECTFACTORY_GITHUB_TOKEN || github.token }}
      - name: Install
        run: npm install
      - name: Apply D1 schema
        run: npm run d1:migrate
      - name: Deploy Worker
        run: npm run deploy
      - name: Verify health
        run: |
          sleep 3
          curl --fail --silent --show-error https://shopee-trend-hunter.safetysc6.workers.dev/health
