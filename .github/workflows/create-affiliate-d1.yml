name: create-affiliate-d1

on:
  push:
    branches:
      - test/create-affiliate-d1

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: safetysc6-ux/affiliate-test-v2
          ref: feat/d1-data-layer
          token: ${{ secrets.PROJECTFACTORY_GITHUB_TOKEN }}
          path: target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        working-directory: target
        run: npm install
      - name: Apply D1 migrations
        working-directory: target
        run: npx wrangler d1 migrations apply affiliate-dashboard-db --remote
      - name: Build and deploy
        working-directory: target
        run: npm run deploy
      - name: Verify D1-backed reports
        run: |
          sleep 5
          curl --fail --silent --show-error 'https://affiliate-test-v2-cf.safetysc6.workers.dev/api/reports?refresh=1' >/tmp/reports.json
          cat /tmp/reports.json
          node -e "const x=require('/tmp/reports.json'); if(x.status!=='success'||x.source!=='cloudflare_d1'||!Array.isArray(x.daily)||!x.daily.length) process.exit(1)"
